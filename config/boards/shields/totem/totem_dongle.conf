CONFIG_ZMK_SPLIT_BLE_CENTRAL_PERIPHERALS=2

CONFIG_ZMK_SLEEP=n

#CONFIG_ZMK_USB_LOGGING=y
#CONFIG_LOG_MODE_IMMEDIATE=n
#CONFIG_LOG_TIMESTAMP_64BIT=y
#CONFIG_LOG_PROCESS_THREAD_STARTUP_DELAY_MS=5000
#CONFIG_ZMK_LOG_LEVEL_DBG=y
#CONFIG_KSCAN_LOG_LEVEL_INF=y

# Totem dongle Raw HID layer reporting (zmk-layer-reporter + zzeneg/zmk-raw-hid).
# RAW_HID_DEVICE="HID_1" only NAMES the second HID instance; USB_HID_DEVICE_COUNT=2
# actually CREATES it. Without the count, only the keyboard HID enumerates and the
# 0xFF60 raw-HID interface never appears on the host.
CONFIG_RAW_HID=y
CONFIG_USB_HID_DEVICE_COUNT=2
CONFIG_ZMK_LAYER_REPORTER=y
CONFIG_ZMK_BATTERY_REPORTING=y
CONFIG_ZMK_SPLIT_BLE_CENTRAL_BATTERY_LEVEL_FETCHING=y
CONFIG_RAW_HID_USAGE_PAGE=0xFF60
CONFIG_RAW_HID_USAGE=0x61
CONFIG_RAW_HID_REPORT_SIZE=32

# ── Drop the USB CDC-ACM serial console from the dongle ──────────────────────
# SYMPTOM (2026-06-19): the raw-HID 0xFF60 interface (HID_1) enumerates but
# streams ZERO bytes — not even the 5s dongle-local heartbeat — while the
# keyboard HID works fine. This is the zmk-raw-hid HID_1 IN-endpoint readiness
# wedge (cf. zzeneg/zmk-raw-hid#3: "Failed to write endpoint buffer 0x84" /
# err -11), made far more likely by an extra CDC-ACM interface consuming USB
# endpoint/resource budget on the nRF52840's legacy USB device stack.
#
# The xiao_ble board force-enables a USB CDC-ACM console: its Kconfig.defconfig
# sources boards/common/usb/Kconfig.cdc_acm_serial.defconfig, which (under
# BOARD_SERIAL_BACKEND_CDC_ACM) force-sets UART_CONSOLE=y and points the DT
# `chosen` console at a board_cdc_acm_uart node — that node is what enumerates
# ttyACM0. A plain CONFIG_USB_CDC_ACM=n is overridden by the board default, so we
# must turn OFF the board CDC serial backend AND delete the chosen-console DT
# refs (see totem_dongle.overlay). Console is moved to RTT so the build keeps a
# console backend without adding any USB interface.
CONFIG_BOARD_SERIAL_BACKEND_CDC_ACM=n
CONFIG_ZMK_USB_LOGGING=n
CONFIG_USB_CDC_ACM=n
CONFIG_UART_CONSOLE=n
CONFIG_USE_SEGGER_RTT=y
CONFIG_RTT_CONSOLE=y
