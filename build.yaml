# The dongle is built by the dedicated .github/workflows/build-dongle.yml
# (board xiao_ble//zmk + studio-rpc-usb-uart + zmk-layer-reporter module).
# This matrix (consumed by the upstream Build ZMK workflow) covers the halves
# and settings_reset only.
include:
  - board: xiao_ble//zmk
    shield: totem_left
  - board: xiao_ble//zmk
    shield: totem_right
  - board: xiao_ble//zmk
    shield: settings_reset