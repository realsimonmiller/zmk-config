# build-dongle.yml
# ═══════════════════════════════════════════════════════════════════════════
# Build Totem ZMK Dongle Firmware — GitHub Actions Workflow
#
# PLACE THIS FILE AT:  .github/workflows/build-dongle.yml
# in your zmk-config repository on branch `totem-dongle`.
#
# TRIGGER
#   • push to `totem-dongle` branch
#   • workflow_dispatch  (Actions tab → "Build Totem Dongle" → Run workflow)
#
# SCOPE: DONGLE ONLY
#   Builds exactly one target:
#     board:   seeeduino_xiao_ble
#     shield:  totem_dongle
#     snippet: studio-rpc-usb-uart
#     cmake:   -DCONFIG_ZMK_STUDIO=y       (ZMK Studio / RPC-over-USB)
#   The split halves are intentionally NOT built by this workflow.
#   To build the halves, use the original .github/workflows/build.yml which
#   delegates to zmkfirmware/zmk build-user-config.yml.
#
# PREREQUISITES (apply to the zmk-config branch before using this workflow)
#   1. Merge totem/firmware/west.yml.fragment into config/west.yml
#      (adds zzeneg remote + zmk-raw-hid project + zmk-layer-reporter project)
#   2. Copy totem/firmware/zmk-layer-reporter/ to
#      config/modules/zmk-layer-reporter/  and commit those files
#   3. Append totem/firmware/totem_dongle.conf.fragment to
#      config/boards/shields/totem/totem_dongle.conf
#
# MODULES WIRED
#   • zmk-raw-hid  (zzeneg/zmk-raw-hid) — fetched by west from GitHub
#   • zmk-layer-reporter (local)         — committed at config/modules/zmk-layer-reporter/
#
# ARTIFACTS (uploaded on every successful run, retained 90 days)
#   • totem.keymap.preprocessed
#       cpp-expanded keymap (authoritative vendored data for T4 initial seed
#       and T20 re-import when the keymap changes)
#   • zmk-seeeduino_xiao_ble-totem_dongle
#       contains zmk.uf2 — flash to the dongle via UF2 boot loader
# ═══════════════════════════════════════════════════════════════════════════

name: Build Totem Dongle

on:
  push:
    branches:
      - totem-dongle
  workflow_dispatch:

jobs:
  build-dongle:
    name: Preprocess keymap + build dongle firmware
    runs-on: ubuntu-latest

    steps:
      # ── 1. Checkout ──────────────────────────────────────────────────────────
      - name: Checkout zmk-config
        uses: actions/checkout@v4

      # ── 2. Python + west ─────────────────────────────────────────────────────
      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install west
        run: pip install west

      # ── 4. West workspace ─────────────────────────────────────────────────────
      #    zmk-layer-reporter is a local Zephyr module passed to the build via
      #    -DZMK_EXTRA_MODULES (step 7), NOT a west project, so west does not try
      #    to clone it. `west update` fetches ZMK and zmk-raw-hid only.
      - name: West init (manifest = config/west.yml)
        run: west init -l config

      - name: West update (ZMK + zmk-raw-hid)
        run: west update

      - name: Export Zephyr CMake package
        run: west zephyr-export

      # ── 5. Zephyr SDK (arm-zephyr-eabi) ──────────────────────────────────────
      - name: Cache Zephyr SDK
        id: cache-zephyr-sdk
        uses: actions/cache@v4
        with:
          path: /opt/zephyr-sdk
          key: zephyr-sdk-0.16.5-arm-zephyr-eabi

      - name: Download and install Zephyr SDK 0.16.5 (arm-zephyr-eabi)
        if: steps.cache-zephyr-sdk.outputs.cache-hit != 'true'
        run: |
          wget -qO /tmp/zephyr-sdk.tar.xz \
            "https://github.com/zephyrproject-rtos/sdk-ng/releases/download/v0.16.5/zephyr-sdk-0.16.5_linux-x86_64_minimal.tar.xz"
          mkdir -p /opt/zephyr-sdk
          tar xf /tmp/zephyr-sdk.tar.xz -C /opt/zephyr-sdk --strip-components=1
          /opt/zephyr-sdk/setup.sh -t arm-zephyr-eabi -h -c

      # Re-register cmake package entries even on a cache hit (paths may shift).
      - name: Register Zephyr SDK cmake packages
        run: /opt/zephyr-sdk/setup.sh -c

      - name: Install host build tools
        run: pip install cmake ninja pyelftools

      # ── 6. Preprocess totem.keymap → totem.keymap.preprocessed ───────────────
      #    Produces the vendored artifact consumed by the layer-viewer's keymap
      #    parser (it keys on raw ZMK keycode names, e.g. SEMICOLON / NUMBER_7,
      #    not on expanded dt-binding macros).
      #
      #    Two devicetree/cpp quirks must be handled:
      #      1. ZMK's angle-bracket `#include <...>` headers transitively pull in
      #         behavior .dtsi files containing `#binding-cells`, which cpp reads
      #         as an invalid directive. We are NOT compiling firmware here, only
      #         flattening keycodes, so strip angle-bracket includes and run with
      #         -nostdinc so cpp never descends into ZMK's dts tree.
      #      2. `#binding-cells` in the keymap itself also starts with '#'; escape
      #         it before cpp and restore it afterwards.
      - name: Preprocess totem.keymap
        run: |
          sed -e '/^[[:space:]]*#include[[:space:]]*</d' \
              -e 's/#binding-cells/@@binding-cells@@/g' \
              config/totem.keymap > /tmp/totem.keymap.in
          cpp -P -nostdinc \
            -I config \
            -I config/boards/shields/totem \
            /tmp/totem.keymap.in \
            -o /tmp/totem.keymap.out
          sed 's/@@binding-cells@@/#binding-cells/g' \
              /tmp/totem.keymap.out > totem.keymap.preprocessed

      - name: Upload totem.keymap.preprocessed artifact
        uses: actions/upload-artifact@v4
        with:
          name: totem.keymap.preprocessed
          path: totem.keymap.preprocessed
          retention-days: 90

      # ── 7. Build dongle firmware ──────────────────────────────────────────────
      #    Board:  xiao_ble//zmk   Shield: totem_dongle   (dongle uf2 only)
      #
      #    ZMK Studio is INTENTIONALLY NOT enabled here. On nRF52840 the USB
      #    endpoint budget (~7 IN endpoints) cannot fit keyboard HID + consumer
      #    HID + raw-HID (HID_1) + Studio's 2x CDC-ACM at once: all interfaces
      #    enumerate but the keyboard's IN endpoint is silently not served, so
      #    the keyboard stops typing. Dropping Studio frees the CDC endpoints so
      #    keyboard HID + raw-HID coexist. The layer viewer needs raw-HID; Studio
      #    is sacrificed on the dongle (the halves' Build ZMK can keep Studio).
      - name: Build dongle firmware (xiao_ble//zmk / totem_dongle)
        run: |
          west build -s zmk/app -d build/dongle \
            -b xiao_ble//zmk \
            -- \
            -DZMK_CONFIG="$(pwd)/config" \
            -DZMK_EXTRA_MODULES="$(pwd)/config/modules/zmk-layer-reporter" \
            -DSHIELD="totem_dongle"

      # ── 7b. Verify USB composition (gate the reflash) ─────────────────────────
      #    We disabled CDC-ACM in totem_dongle.conf to free a USB endpoint for the
      #    raw-HID (HID_1) IN endpoint. Assert it actually took effect in the
      #    resolved .config so we never flash a build that still ships ttyACM.
      #    Expected: CDC-ACM OFF, USB_HID_DEVICE_COUNT=2, RAW_HID ON.
      - name: Verify USB composition in resolved .config
        run: |
          CFG=build/dongle/zephyr/.config
          DTS=build/dongle/zephyr/zephyr.dts
          echo "── USB-relevant config lines ──"
          grep -E 'CONFIG_(USB_CDC_ACM|UART_CONSOLE|ZMK_USB_LOGGING|USB_HID_DEVICE_COUNT|RAW_HID|BOARD_SERIAL_BACKEND_CDC_ACM|RTT_CONSOLE)\b' "$CFG" || true
          echo "── assertions ──"
          fail=0
          if grep -q '^CONFIG_USB_CDC_ACM=y' "$CFG"; then echo "FAIL: USB_CDC_ACM still enabled"; fail=1; else echo "OK: USB_CDC_ACM not enabled"; fi
          if grep -q '^CONFIG_UART_CONSOLE=y' "$CFG"; then echo "FAIL: UART_CONSOLE still y (CDC console not dropped)"; fail=1; else echo "OK: UART_CONSOLE not y"; fi
          if grep -q '^CONFIG_USB_HID_DEVICE_COUNT=2' "$CFG"; then echo "OK: USB_HID_DEVICE_COUNT=2"; else echo "FAIL: USB_HID_DEVICE_COUNT != 2"; fail=1; fi
          if grep -q '^CONFIG_RAW_HID=y' "$CFG"; then echo "OK: RAW_HID enabled"; else echo "FAIL: RAW_HID not enabled"; fail=1; fi
          if [ -f "$DTS" ] && grep -q 'zephyr,console' "$DTS"; then echo "WARN: zephyr,console still present in zephyr.dts (inspect for cdc-acm)"; grep -n 'zephyr,console\|cdc-acm' "$DTS" || true; fi
          exit $fail

      - name: Upload dongle .uf2 artifact
        uses: actions/upload-artifact@v4
        with:
          name: zmk-seeeduino_xiao_ble-totem_dongle
          path: build/dongle/zephyr/zmk.uf2
          retention-days: 90
